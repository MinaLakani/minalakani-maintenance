<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f2ebe2">
  <title>Mina Lakani | Official Website</title>
  <style>
    :root{--ivory:#f2ebe2;--sand:#ded0c2;--ink:#261f1b;--muted:#665b53;--wine:#713f45}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem;background:linear-gradient(135deg,var(--ivory),var(--sand));color:var(--ink);font-family:Georgia,"Times New Roman",serif;text-align:center}
    main{max-width:46rem;padding:clamp(2.5rem,7vw,5.5rem);background:rgba(255,255,255,.42);border:1px solid rgba(38,31,27,.16);box-shadow:0 1.5rem 4rem rgba(38,31,27,.08)}
    .mark{display:grid;place-items:center;width:3.5rem;aspect-ratio:1;margin:0 auto 2rem;border:1px solid rgba(38,31,27,.35);border-radius:50%;font-family:Didot,"Bodoni MT",Georgia,serif;letter-spacing:.08em}
    .eyebrow{margin:0 0 1.25rem;color:var(--wine);font-family:Arial,Helvetica,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-family:Didot,"Bodoni MT",Baskerville,Georgia,serif;font-size:clamp(2.7rem,7vw,5rem);font-weight:400;line-height:1}
    p{max-width:35rem;margin:1.75rem auto 0;color:var(--muted);font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.7}
    .note{margin-top:2.25rem;color:var(--wine);font-family:Arial,Helvetica,sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ML</div>
    <p class="eyebrow">Official Website</p>
    <h1>Mina Lakani</h1>
    <p>The website is currently being thoughtfully updated. Please check back soon for the renewed official site.</p>
    <p class="note">Theatre · Film · Television</p>
  </main>
</body>
</html>
